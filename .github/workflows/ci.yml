name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the Pi test host
        run: npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund @earendil-works/pi-coding-agent@1.6.0
      - name: Run behavior and Git installation checks
        run: make check PI_NODE_MODULES="$RUNNER_TEMP/pi-host/node_modules" PI_BIN="$RUNNER_TEMP/pi-host/node_modules/.bin/pi"
