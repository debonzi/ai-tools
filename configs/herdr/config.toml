# Keep first-run setup from writing to this repository-managed dotfile.
onboarding = false

[terminal]
# Match the managed tmux default and create new panes from the focused pane's
# working directory.
default_shell = "/usr/bin/zsh"
new_cwd = "follow"

[ui]
# Match tmux's mouse-enabled workflow. Text selection remains copy-on-select
# through Herdr's native default.
mouse_capture = true

show_agent_labels_on_pane_borders = false
[keys]
# Keep the tmux prefix and its split muscle memory. Other navigation and tab
# bindings use Herdr's native tmux-compatible defaults.
prefix = "ctrl+b"
# Focus Agent panel entries 1-9 with prefix followed by Alt+number.
focus_agent = "prefix+alt+1..9"
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"

# Optional tmux-inspired theme. Leave this block commented to evaluate the
# native Herdr theme first; remove the comment markers to enable it.
# [theme.custom]
# panel_bg = "#0f172a"
# surface_dim = "#0f172a"
# surface0 = "#1e3a8a"
# surface1 = "#2563eb"
# overlay0 = "#1e3a8a"
# overlay1 = "#2563eb"
# accent = "#2563eb"
# blue = "#2563eb"
# text = "#c7d2fe"
# subtext0 = "#c7d2fe"

[experimental]
pane_history = false
